spring:
  application:
    name: mini-wallet
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  pattern:
    # Adds the trace id from TraceIdFilter to every log line, e.g. "INFO [6f1c2a9b8e7d4c3b]".
    level: "%5p [%X{traceId:-}]"
