# Matches docker-compose.yml at the repository root.
spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/wallet
    username: wallet
    password: wallet
  data:
    redis:
      host: localhost
      port: 6379

app:
  jwt:
    # Local development and tests only. Never reuse this value anywhere else.
    secret: local-dev-secret-not-for-production-0123456789

logging:
  level:
    com.khoaphamlee.wallet: DEBUG
